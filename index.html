<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Einkaufsliste XXL MAX</title>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrYuAlm-Kf7ccrxsGG-e5ejAWkBubm2Ag",
            authDomain: "einkaufsliste-74d29.firebaseapp.com",
            projectId: "einkaufsliste-74d29",
            storageBucket: "einkaufsliste-74d29.firebasestorage.app",
            messagingSenderId: "659719253944",
            appId: "1:659719253944:web:e7eb3066241ecc6519a94d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let liste = [];
        let historie = [];
        let isInitialized = false;

        onSnapshot(doc(db, "daten", "einkaufsliste_hauptdaten"), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                liste = data.einkauf || [];
                historie = data.historie || [];
                
                // Top10 nur beim ersten Laden berechnen
                if (!isInitialized) {
                    berechneTop10();
                    isInitialized = true;
                }
                render();
            }
        });

        window.saveToCloud = function() {
            setDoc(doc(db, "daten", "einkaufsliste_hauptdaten"), {
                einkauf: liste,
                historie: historie
            });
        };

        function berechneTop10() {
            const letzte100 = historie.slice(-100);
            const counts = {};
            letzte100.forEach(i => counts[i] = (counts[i] || 0) + 1);
            const top10 = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 10);
            document.getElementById('top-bar').innerHTML = top10.map(t => 
                `<button class="top-btn" onclick="hinzufuegen('${t.replace(/'/g, "\\'")}')">${t}</button>`
            ).join('');
        }

        window.hinzufuegen = function(produkt = null) {
            const val = produkt || document.getElementById('eingabe').value.trim();
            if (!val) return;
            liste.unshift({id: Date.now(), text: val, done: false, qty: 1});
            historie.push(val);
            document.getElementById('eingabe').value = '';
            document.getElementById('vorschlaege').style.display = 'none';
            saveToCloud();
            render();
        };

        window.leereErledigte = function() {
            if(confirm("Alle erledigten Artikel löschen?")) {
                liste = liste.filter(i => !i.done);
                saveToCloud();
                render();
            }
        };

        window.leereAlles = function() {
            if(confirm("Wirklich die KOMPLETTE Liste leeren?")) {
                liste = [];
                saveToCloud();
                render();
            }
        };

        window.render = function() {
            const sortierte = [...liste].sort((a, b) => a.done - b.done || b.id - a.id);
            document.getElementById('einkaufsliste').innerHTML = sortierte.map(i => `
                <li class="${i.done ? 'completed' : ''}">
                    <input type="checkbox" ${i.done ? 'checked' : ''} onchange="toggleCheck(${i.id})">
                    <span>${i.text}</span>
                    <div class="qty-ctrl">
                        <button class="qty-btn" onclick="changeQty(${i.id}, -1)">-</button>
                        <span>${i.qty}</span>
                        <button class="qty-btn" onclick="changeQty(${i.id}, 1)">+</button>
                    </div>
                    <button class="del-btn" onclick="loeschen(${i.id})">✕</button>
                </li>`).join('');
        };

        window.toggleCheck = (id) => { liste.find(i => i.id === id).done = !liste.find(i => i.id === id).done; saveToCloud(); render(); };
        window.changeQty = (id, delta) => { let i = liste.find(x => x.id === id); i.qty = Math.max(1, i.qty + delta); saveToCloud(); render(); };
        window.loeschen = (id) => { liste = liste.filter(i => i.id !== id); saveToCloud(); render(); };

        // Admin Logik bleibt gleich...
        window.zeigeAdmin = (o) => { document.getElementById('main-view').style.display = o ? 'none' : 'block'; document.getElementById('admin-view').style.display = o ? 'block' : 'none'; };
    </script>

    <style>
        :root { --main-color: #059669; }
        body { font-family: sans-serif; background: #f8fafc; margin: 0; padding: 14px; }
        .container { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-small { flex: 1; padding: 8px; font-size: 0.8rem; border: none; border-radius: 8px; cursor: pointer; background: #e2e8f0; }
        .top-btn { font-size: 0.9rem; padding: 8px 12px; background: #d1fae5; border: none; border-radius: 20px; cursor: pointer; margin: 4px; }
        li { display: grid; grid-template-columns: 40px 1fr 100px 40px; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .completed { color: #aaa; text-decoration: line-through; }
        .qty-btn { background: #eee; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .del-btn { background: #fee2e2; color: red; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div id="main-view" class="container">
    <h2>Einkaufsliste</h2>
    <input type="text" id="eingabe" placeholder="Produkt..." style="width: 100%; padding: 12px; box-sizing: border-box;">
    <button onclick="hinzufuegen()" style="width: 100%; padding: 12px; margin-top: 5px; background: var(--main-color); color: white; border: none; border-radius: 8px;">Hinzufügen</button>
    
    <div class="btn-group">
        <button class="btn-small" onclick="leereErledigte()">Erledigte löschen</button>
        <button class="btn-small" onclick="leereAlles()">Alles leeren</button>
    </div>

    <div id="top-bar" style="margin: 15px 0;"></div>
    <ul id="einkaufsliste" style="list-style: none; padding: 0;"></ul>
</div>

</body>
</html>
